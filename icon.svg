<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.5 5.5 53 53" width="64" height="64" role="img" aria-label="Orchestrator">
  <!-- dimOS app icon set v6: dark glass tile tinted to the glyph, neon gradient glyph with a soft bloom -->
  <defs>
    <radialGradient id="orch-tile" cx=".5" cy=".18" r=".95"><stop offset="0" stop-color="#1d1238"/><stop offset="1" stop-color="#07070f"/></radialGradient>
    <linearGradient id="orch-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="orch-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".25" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
    <filter id="orch-bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <linearGradient id="orch-a" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="50"><stop offset="0" stop-color="#e6d2ff"/><stop offset="1" stop-color="#8a4dff"/></linearGradient>
    <g id="orch-glyph">
      <circle cx="19" cy="21" r="6.5" fill="url(#orch-a)"/>
      <circle cx="45" cy="21" r="6" fill="none" stroke="url(#orch-a)" stroke-width="3"/>
      <circle cx="32" cy="44" r="6" fill="none" stroke="url(#orch-a)" stroke-width="3"/>
      <path d="M27 21H36M33 17.5L37 21L33 24.5" fill="none" stroke="url(#orch-a)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M41.5 27.5L36.6 36.4M36 31.6L35.9 37L40.7 35.4" fill="none" stroke="url(#orch-a)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M25.5 43C19.5 41 17 35.5 18 29.5" fill="none" stroke="url(#orch-a)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.4"/></g>
    <linearGradient id="orch-scanrow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#e2e2e2"/><stop offset=".5" stop-color="#c2c2c2"/><stop offset=".75" stop-color="#e2e2e2"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <pattern id="orch-scan" width="64" height="3.6" patternUnits="userSpaceOnUse"><rect width="64" height="3.6" fill="url(#orch-scanrow)"/></pattern>
    <mask id="orch-scanlines" maskUnits="userSpaceOnUse" x="-16" y="-16" width="96" height="96"><rect x="-16" y="-16" width="96" height="96" fill="url(#orch-scan)"/></mask>
    <filter id="orch-core" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="erode" radius="0.9" result="e"/><feGaussianBlur in="e" stdDeviation="0.45" result="eb"/><feFlood flood-color="#fffaf0" flood-opacity=".24"/><feComposite in2="eb" operator="in" result="c"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="c"/></feMerge></filter>
  </defs>
  <g transform="translate(32 32) scale(1.12) translate(-32 -32)">
    <use href="#orch-glyph" filter="url(#orch-bloom)" opacity=".6"/>
    <g mask="url(#orch-scanlines)"><use href="#orch-glyph" filter="url(#orch-core)"/></g>
  </g>
</svg>
